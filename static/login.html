<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Hakikisha Insurance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 450px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-container h2 {
            color: #667eea;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.8rem;
        }
        
        .login-methods {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        
        .login-methods button {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            background: #f5f5f5;
            color: #666;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-methods button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .login-methods button:hover:not(.active) {
            background: #e0e0e0;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 0.5rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .switch-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .switch-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .message {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .error-message {
            color: #d32f2f;
            background: #ffebee;
            border-left: 4px solid #d32f2f;
        }
        
        .success-message {
            color: #2e7d32;
            background: #e8f5e9;
            border-left: 4px solid #2e7d32;
        }
        
        .info-message {
            color: #1976d2;
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .home-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .home-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .home-link a:hover {
            text-decoration: underline;
        }
        
        #otpSection {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        #otpSection input {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Tab Selection -->
        <div class="login-methods">
            <button id="emailTab" class="active" onclick="showEmailAuth()">Email Login</button>
            <button id="otpTab" onclick="showOTPAuth()">OTP Login</button>
        </div>

        <!-- Email/Password Authentication -->
        <div id="emailAuthBox">
            <!-- Login Form -->
            <div id="loginBox">
                <h2>Login</h2>
                <div id="loginError" class="message error-message"></div>
                <div id="loginLoading" class="loading">Logging in</div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="Enter your password">
                    </div>
                    
                    <div class="form-group">
                        <label for="login-role">I am a:</label>
                        <select id="login-role" required>
                            <option value="">Select Role</option>
                            <option value="customer">Customer</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="loginBtn">Login</button>
                </form>
                
                <span class="switch-link" onclick="showRegister()">Don't have an account? Register</span>
            </div>

            <!-- Register Form -->
            <div id="registerBox" style="display:none;">
                <h2>Register</h2>
                <div id="registerError" class="message error-message"></div>
                <div id="registerSuccess" class="message success-message"></div>
                <div id="registerLoading" class="loading">Creating account</div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input type="text" id="register-name" required placeholder="Enter your full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" required placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" required placeholder="At least 8 characters">
                    </div>
                    
                    <div class="form-group">
                        <label for="register-role">I am a:</label>
                        <select id="register-role" required>
                            <option value="">Select Role</option>
                            <option value="customer">Customer</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="registerBtn">Register</button>
                </form>
                
                <span class="switch-link" onclick="showLogin()">Already have an account? Login</span>
            </div>
        </div>

        <!-- OTP Authentication -->
        <div id="otpAuthBox" style="display:none;">
            <h2>Login with OTP</h2>
            <div id="otpError" class="message error-message"></div>
            <div id="otpInfo" class="message info-message"></div>
            <div id="otpLoading" class="loading">Processing</div>
            
            <form id="otpRequestForm">
                <div class="form-group">
                    <label for="otp-email">Email</label>
                    <input type="email" id="otp-email" required placeholder="Enter your registered email">
                </div>
                
                <div class="form-group">
                    <label for="otp-role">I am a:</label>
                    <select id="otp-role" required>
                        <option value="">Select Role</option>
                        <option value="customer">Customer</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary" id="sendOTPBtn">Send OTP</button>
            </form>
            
            <!-- OTP Verification Section (Hidden initially) -->
            <div id="otpSection" style="display:none;">
                <div class="form-group">
                    <label for="otp-code">Enter 6-digit OTP</label>
                    <input type="text" id="otp-code" maxlength="6" placeholder="000000" required>
                </div>
                <button class="btn-primary" onclick="verifyOTP()">Verify OTP</button>
                <button class="btn-primary" onclick="resendOTP()" style="background: #6c757d; margin-top: 10px;">Resend OTP</button>
            </div>
        </div>
        
        <!-- Home Link -->
        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
    // Configuration
    const API_BASE = window.location.origin + '/api';
    
    // UI Helper Functions
    function showMessage(elementId, message, type = 'error') {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = `message ${type}-message`;
        element.style.display = 'block';
        console.log(`${type.toUpperCase()}:`, message);
    }

    function hideMessage(elementId) {
        document.getElementById(elementId).style.display = 'none';
    }

    function showLoading(elementId, show = true) {
        document.getElementById(elementId).style.display = show ? 'block' : 'none';
    }

    // Tab Switching
    function showEmailAuth() {
        document.getElementById('emailAuthBox').style.display = 'block';
        document.getElementById('otpAuthBox').style.display = 'none';
        document.getElementById('emailTab').classList.add('active');
        document.getElementById('otpTab').classList.remove('active');
        hideMessage('loginError');
        hideMessage('registerError');
    }

    function showOTPAuth() {
        document.getElementById('emailAuthBox').style.display = 'none';
        document.getElementById('otpAuthBox').style.display = 'block';
        document.getElementById('emailTab').classList.remove('active');
        document.getElementById('otpTab').classList.add('active');
        hideMessage('otpError');
    }

    function showRegister() {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('registerBox').style.display = 'block';
        hideMessage('registerError');
        hideMessage('registerSuccess');
    }

    function showLogin() {
        document.getElementById('registerBox').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
        hideMessage('loginError');
    }

    // Email/Password Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        hideMessage('loginError');
        showLoading('loginLoading', true);
        
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const role = document.getElementById('login-role').value;
        
        if (!role) {
            showMessage('loginError', 'Please select your role', 'error');
            showLoading('loginLoading', false);
            return;
        }
        
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, password, role })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                showMessage('loginError', 'Login successful! Redirecting...', 'success');
                
                // Store role in session
                sessionStorage.setItem('userRole', role);
                sessionStorage.setItem('userEmail', email);
                
                setTimeout(() => {
                    if (role === 'staff') {
                        window.location.href = '/static/staff-portal.html';  // ✅ FIXED
                    } else {
                        window.location.href = '/static/customer-portal.html';  // ✅ FIXED
                    }
                }, 1000);
            } else {
                showMessage('loginError', data.error || 'Login failed. Please try again.', 'error');
                loginBtn.disabled = false;
            }
        } catch (error) {
            console.error('Login error:', error);
            showMessage('loginError', 'Connection error. Please try again.', 'error');
            loginBtn.disabled = false;
        } finally {
            showLoading('loginLoading', false);
        }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        hideMessage('registerError');
        hideMessage('registerSuccess');
        showLoading('registerLoading', true);
        
        const name = document.getElementById('register-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        const role = document.getElementById('register-role').value;
        
        if (!role) {
            showMessage('registerError', 'Please select your role', 'error');
            showLoading('registerLoading', false);
            return;
        }
        
        if (password.length < 8) {
            showMessage('registerError', 'Password must be at least 8 characters', 'error');
            showLoading('registerLoading', false);
            return;
        }
        
        const registerBtn = document.getElementById('registerBtn');
        registerBtn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                showMessage('registerSuccess', 'Registration successful! Please login.', 'success');
                setTimeout(() => showLogin(), 2000);
            } else {
                showMessage('registerError', data.error || 'Registration failed. Please try again.', 'error');
                registerBtn.disabled = false;
            }
        } catch (error) {
            console.error('Register error:', error);
            showMessage('registerError', 'Connection error. Please try again.', 'error');
            registerBtn.disabled = false;
        } finally {
            showLoading('registerLoading', false);
        }
    });

    // OTP Request
    let otpEmail = '';
    let otpRole = '';
    
    document.getElementById('otpRequestForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        hideMessage('otpError');
        hideMessage('otpInfo');
        showLoading('otpLoading', true);
        
        otpEmail = document.getElementById('otp-email').value.trim();
        otpRole = document.getElementById('otp-role').value;
        
        if (!otpRole) {
            showMessage('otpError', 'Please select your role', 'error');
            showLoading('otpLoading', false);
            return;
        }
        
        const sendBtn = document.getElementById('sendOTPBtn');
        sendBtn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: otpEmail, role: otpRole })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                showMessage('otpInfo', 'OTP sent! Please check your email.', 'info');
                document.getElementById('otpSection').style.display = 'block';
                document.getElementById('otpRequestForm').style.display = 'none';
            } else {
                showMessage('otpError', data.error || 'Failed to send OTP.', 'error');
                sendBtn.disabled = false;
            }
        } catch (error) {
            console.error('Send OTP error:', error);
            showMessage('otpError', 'Connection error. Please try again.', 'error');
            sendBtn.disabled = false;
        } finally {
            showLoading('otpLoading', false);
        }
    });

    // Verify OTP
    async function verifyOTP() {
        hideMessage('otpError');
        showLoading('otpLoading', true);
        
        const otpCode = document.getElementById('otp-code').value.trim();
        
        if (!otpCode || otpCode.length !== 6) {
            showMessage('otpError', 'Please enter a valid 6-digit OTP', 'error');
            showLoading('otpLoading', false);
            return;
        }
        
        try {
            const response = await fetch(`${API_BASE}/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ otp: otpCode })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                showMessage('otpInfo', 'Login successful! Redirecting...', 'success');
                
                // Store role in session
                sessionStorage.setItem('userRole', otpRole);
                sessionStorage.setItem('userEmail', otpEmail);
                
                setTimeout(() => {
                    if (otpRole === 'staff') {
                        window.location.href = '/static/staff-portal.html';  // ✅ FIXED
                    } else {
                        window.location.href = '/static/customer-portal.html';  // ✅ FIXED
                    }
                }, 1000);
            } else {
                showMessage('otpError', data.error || 'Invalid OTP. Please try again.', 'error');
            }
        } catch (error) {
            console.error('Verify OTP error:', error);
            showMessage('otpError', 'Connection error. Please try again.', 'error');
        } finally {
            showLoading('otpLoading', false);
        }
    }

    // Resend OTP
    async function resendOTP() {
        hideMessage('otpError');
        showLoading('otpLoading', true);
        
        try {
            const response = await fetch(`${API_BASE}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: otpEmail, role: otpRole })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                showMessage('otpInfo', 'OTP resent! Please check your email.', 'info');
            } else {
                showMessage('otpError', data.error || 'Failed to resend OTP.', 'error');
            }
        } catch (error) {
            console.error('Resend OTP error:', error);
            showMessage('otpError', 'Connection error. Please try again.', 'error');
        } finally {
            showLoading('otpLoading', false);
        }
    }
</script>
</body>
</html>
